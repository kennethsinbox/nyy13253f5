name: Daily Apartment Check

on:
  schedule:
    - cron: '0 12 * * *' # Runs at 12:00 UTC (8:00 AM EST)
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install gspread oauth2client requests

      - name: Run Apartment Agent
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          API_KEY: ${{ secrets.REAL_ESTATE_API_KEY }}
        run: python apartment_agent.py
